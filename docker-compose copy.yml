services:
  mongodb:
    image: mongo:8
    container_name: Accusoftmongodb
    restart: always
    volumes:
      - mongo_data:/data/db
    # ports:
    #   - "27018:27017"

  backend:
    build: ./server
    container_name: server
    restart: always
    # ports:
    #   - "5000:5000"
    env_file:
    - ./server/.env
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: accufrontend
    restart: always
    ports:
      - "81:80"
    depends_on:
      - backend

volumes:
  mongo_data:
